server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: marketmind-backend
  datasource:
    url: jdbc:sqlite:./data/marketmind.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# MarketMind Application Configuration
marketmind:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  ai:
    provider: ${AI_PROVIDER:groq} # 'groq' or 'gemini'
    groq:
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:openai/gpt-oss-120b}
      fallback-model: qwen/qwen3.8-27b
      base-url: https://api.groq.com/openai/v1
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
      base-url: https://generativelanguage.googleapis.com/v1beta
  tavily:
    api-key: ${TAVILY_API_KEY:}
    base-url: https://api.tavily.com
    timeout-ms: 12000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
